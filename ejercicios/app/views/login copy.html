<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión GoodCrew</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <main class="contenedor">
        <section class="informacion">
            <div class="informacion__contenido">
                <img class="logo" src="static/images/equipo.png" alt="Logo GoodCrew">

                <h1>Bienvenido al Ecosistema Digital GoodCrew</h1>

                <p>Coordina a tu equipo, da seguimiento a tus actividades y mantén toda la información en un solo lugar.</p>

                <ul class="lista">
                    <li>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/></svg>
                        Trabajo en equipo
                    </li>
                    <li>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
                        Seguimiento de actividades
                    </li>
                    <li>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
                        Gestión centralizada
                    </li>
                </ul>
            </div>
        </section>

        <!-- Zona derecha: tarjeta + imagen -->
        <div class="zona">

            <section class="login">
                <form class="tarjeta" method="POST" id="formLogin" novalidate>

                    <header class="tarjeta__encabezado">
                        <h3>Acceso</h3>
                        <h2>GoodCrew</h2>
                    </header>

                    <div class="tarjeta__cuerpo">

                    <div class="campo">
                        <label for="usuario">Usuario</label>
                        <div class="entrada">
                            <span class="icono" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                            </span>
                            <input
                                type="text"
                                id="usuario"
                                name="usuario"
                                placeholder="Usuario"
                                autocomplete="username"
                                required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="password">Contraseña</label>
                        <div class="entrada">
                            <span class="icono" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                            </span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Contraseña"
                                autocomplete="current-password"
                                required>
                            <button type="button" class="ver" id="verPassword"
                                    aria-label="Mostrar contraseña" aria-pressed="false">
                                <svg class="ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg class="ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.4-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                            </button>
                        </div>
                    </div>

                    <a class="olvido" href="/recuperar-password">¿Olvidó su contraseña?</a>

                    <p class="mensaje-error" id="mensajeError" role="alert" aria-live="polite"></p>

                    <button type="submit" class="boton" id="botonIngresar">
                        <span class="boton__texto">Ingresar</span>
                        <span class="boton__spinner" aria-hidden="true"></span>
                    </button>

                    </div>
                </form>
            </section>

        </div>
    </main>

    <script src="static/js/login.js"></script>
</body>
</html>
